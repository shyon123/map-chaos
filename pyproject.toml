[project]
name = "mcp-chaos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.9,<3",
    "anyio>=4.6",
    "structlog>=24.4",
    "pyyaml>=6",
]

[project.scripts]
mcp-chaos = "mcp_chaos.bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_chaos"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "pre-commit>=4",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not quarantine'"
markers = [
    "live: calls real LLM APIs (opt-in, costs money)",
    "quarantine: known-flaky, must link an issue",
]

[tool.coverage.run]
source = ["mcp_chaos"]
branch = true

[tool.coverage.report]
show_missing = true
